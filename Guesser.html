 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Guesser.css">
    <title>Guesser</title>
</head>
<body>
    <main class="back">

        <button class="start">Start Game</button>
        <div class="body">
            <p>Guess my Number</p>

            <p class="hint">The number is between 1 and 20</p>
            <p class="trials">Trials left: <span id="number"></span></p>

            <input type="number" class="input" maxlength="3">

            <p class="value">Enter a number</p>

            <button class="submit">submit</button>
            <button class="restart">Restart</button>
        </div>
    </main>



    <script src="Guesser.js"></script>
</body>
</html>
